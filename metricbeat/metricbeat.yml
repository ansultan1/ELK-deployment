metricbeat.modules:
  # Host (the VSI itself)
  - module: system
    period: 10s
    metricsets: [cpu, load, memory, network, process, process_summary, socket_summary, filesystem, fsstat, uptime]
    processes: ['.*']
    process.include_top_n: { by_cpu: 5, by_memory: 5 }
    hostfs: /hostfs
    filesystem.ignore_types: [nfs, smbfs, autofs, tmpfs, overlay]
    processors:
      - add_host_metadata: ~   # host.* only describes the VSI for host-level metrics

  # Containers
  - module: docker
    period: 10s
    hosts: ["unix:///var/run/docker.sock"]
    metricsets: [container, cpu, diskio, info, memory, network, healthcheck]
    processors:
      # Identify the monitored container, not the VSI metricbeat runs on
      - drop_fields:
          fields: [host, docker.container.labels]   # labels: one mapped field each -> blew the 10000 field limit
          ignore_missing: true
      - copy_fields:
          fields:
            - { from: container.name, to: host.name }
          fail_on_error: false
          ignore_missing: true

  # The stack monitors itself (feeds Kibana "Stack Monitoring")
  - module: elasticsearch
    xpack.enabled: true
    period: 10s
    hosts: ["https://localhost:9200"]
    username: beats_internal
    password: "${BEATS_PASSWORD}"
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]

  - module: kibana
    xpack.enabled: true
    period: 10s
    hosts: ["https://localhost:5601"]
    username: beats_internal
    password: "${BEATS_PASSWORD}"
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]

  - module: logstash
    xpack.enabled: true
    period: 10s
    hosts: ["localhost:9600"]

# No global add_host_metadata: it stamped the VSI's host.* onto every event (docker, stack modules)
processors:
  - add_docker_metadata: ~
  - drop_fields:
      fields: [container.labels, docker.container.labels]
      ignore_missing: true

# Headroom for the many module fields; overwrite so the new limit reaches the existing template
setup.template.overwrite: true
setup.template.settings:
  index.mapping.total_fields.limit: 20000

output.elasticsearch:
  hosts: ["https://localhost:9200"]
  username: beats_internal
  password: "${BEATS_PASSWORD}"
  ssl.certificate_authorities: ["/certs/ca/ca.crt"]

logging.level: info
logging.to_files: false
# TEMP: print rejected events and Elasticsearch's reason (status=400) to stderr; remove once fixed
logging.event_data.to_stderr: true
