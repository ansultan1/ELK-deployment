input {
  beats {
    port => 5044
  }
  # Test ingestion endpoint: curl -u ingest:$LS_HTTP_PASSWORD -XPOST localhost:8080 -d '{"msg":"hi"}'
  http {
    port     => 8080
    user     => "ingest"
    password => "${LS_HTTP_PASSWORD}"
    tags     => ["http_test"]
  }
}

filter {
  # Filebeat's own and Logstash's own chatter is not interesting
  if [container][name] == "elk-filebeat-1" { drop {} }

  # JSON application logs -> structured fields under [app]
  if [message] =~ /^\s*\{/ {
    json { source => "message" target => "app" skip_on_invalid_json => true }
  }
  if [app][ts] {
    date { match => ["[app][ts]", "ISO8601"] target => "@timestamp" remove_field => ["[app][ts]"] }
  }
  if [app][level] {
    mutate { add_field => { "[log][level]" => "%{[app][level]}" } }
  }

  # Route to a data stream: logs-<dataset>-prod
  if "http_test" in [tags] {
    mutate { add_field => { "[data_stream][dataset]" => "test" } }
  } else if [container][name] == "sample-app" {
    mutate { add_field => { "[data_stream][dataset]" => "app" } }
  } else {
    mutate { add_field => { "[data_stream][dataset]" => "docker" } }
  }
  mutate { add_field => { "[data_stream][type]" => "logs" "[data_stream][namespace]" => "prod" } }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    user     => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    data_stream => "true"
  }
}
